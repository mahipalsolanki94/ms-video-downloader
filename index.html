
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Video Downloader</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:linear-gradient(135deg,#101827,#1e3a5f);
 font-family:Arial,sans-serif;
 color:white;
}
.container{
 width:100%;
 max-width:450px;
 background:#1e293b;
 padding:28px 22px;
 border-radius:20px;
 text-align:center;
 box-shadow:0 12px 35px #0006;
}
.logo{
 font-size:40px;
 font-weight:bold;
 color:#38bdf8;
}
h1{font-size:25px}
p{color:#cbd5e1}
input{
 width:100%;
 padding:16px;
 margin:15px 0;
 border:2px solid #475569;
 border-radius:10px;
 background:#0f172a;
 color:white;
 font-size:15px;
}
button{
 width:100%;
 padding:16px;
 background:#16a34a;
 color:white;
 border:0;
 border-radius:10px;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.6}
#message{
 margin-top:18px;
 overflow-wrap:anywhere;
 line-height:1.5;
}
video{
 width:100%;
 margin-top:18px;
 border-radius:10px;
}
.footer{
 margin-top:25px;
 color:#94a3b8;
 font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">MS</div>

<h1>MS Video Downloader</h1>

<p>Paste your direct MP4 video link</p>

<input
 id="videoURL"
 type="url"
 placeholder="Paste video link here"
>

<button id="downloadBtn" type="button">
Download Video
</button>

<div id="message" role="status"></div>

<video id="preview" controls hidden></video>

<div class="footer">
© 2026 MS Video Downloader
</div>

</div>

<script>
(function(){

 const input=document.getElementById("videoURL");
 const button=document.getElementById("downloadBtn");
 const message=document.getElementById("message");
 const preview=document.getElementById("preview");

 button.addEventListener("click",async function(){

  const url=input.value.trim();

  message.textContent="";
  preview.hidden=true;

  if(!url){
   message.textContent="Please paste a video link.";
   return;
  }

  let parsed;

  try{
   parsed=new URL(url);
   if(parsed.protocol!=="https:" &&
      parsed.protocol!=="http:"){
    throw new Error();
   }
  }catch(error){
   message.textContent="Invalid video link!";
   return;
  }

  if(!/\.mp4$/i.test(parsed.pathname)){
   message.textContent="Please enter a direct MP4 link.";
   return;
  }

  button.disabled=true;
  message.textContent="Please wait...";

  try{

   const response=await fetch(url);

   if(!response.ok){
    throw new Error("Server error");
   }

   const blob=await response.blob();

   if(!blob.type.startsWith("video/") &&
      blob.type!=="application/octet-stream"){
    throw new Error("Invalid video");
   }

   const videoURL=URL.createObjectURL(blob);

   preview.src=videoURL;
   preview.hidden=false;

   const link=document.createElement("a");
   link.href=videoURL;
   link.download="MS-Video.mp4";

   document.body.appendChild(link);
   link.click();
   link.remove();

   message.textContent="Download started!";

  }catch(error){

   message.textContent=
   "Download failed. This server may block browser downloads. Try another direct MP4 link.";

  }finally{

   button.disabled=false;

  }

 });

})();
</script>

</body>
</html>
