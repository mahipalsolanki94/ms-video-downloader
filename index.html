
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Video Downloader</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 background:#101827;
 color:white;
 font-family:Arial,sans-serif;
}
.container{
 width:100%;
 max-width:450px;
 background:#1e293b;
 padding:25px;
 border-radius:18px;
 text-align:center;
}
.logo{font-size:38px;color:#38bdf8;font-weight:bold}
h1{font-size:25px}
input{
 width:100%;
 padding:15px;
 margin:15px 0;
 border:1px solid #64748b;
 border-radius:9px;
 background:#0f172a;
 color:white;
 font-size:15px;
}
button{
 width:100%;
 padding:15px;
 border:0;
 border-radius:9px;
 background:#16a34a;
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
button:disabled{opacity:.6}
#message{margin-top:18px;overflow-wrap:anywhere}
video{width:100%;margin-top:15px}
small{color:#cbd5e1}
</style>
</head>
<body>
<div class="container">
 <div class="logo">MS</div>
 <h1>MS Video Downloader</h1>
 <p>Paste your direct MP4 video link</p>

 <input id="videoURL" type="url"
 placeholder="Paste video link here">

 <button id="downloadBtn" type="button">
 Download Video
 </button>

 <p id="message" role="status"></p>
 <video id="preview" controls hidden></video>
 <small>Supports direct MP4 links when the server allows downloading.</small>
</div>

<script>
const input=document.getElementById("videoURL");
const button=document.getElementById("downloadBtn");
const message=document.getElementById("message");
const preview=document.getElementById("preview");

button.addEventListener("click", async function(){

 const url=input.value.trim();
 message.textContent="";
 preview.hidden=true;

 if(!url){
  message.textContent="Please paste a video link first.";
  return;
 }

 let parsed;
 try{
  parsed=new URL(url);
  if(!["http:","https:"].includes(parsed.protocol))
   throw new Error();
 }catch(e){
  message.textContent="Please enter a valid video URL.";
  return;
 }

 if(!/\.mp4$/i.test(parsed.pathname)){
  message.textContent="Please enter a direct MP4 file link.";
  return;
 }

 button.disabled=true;
 message.textContent="Checking video...";

 try{
  const response=await fetch(url);

  if(!response.ok) throw new Error("Video unavailable");

  const blob=await response.blob();

  if(!blob.type.startsWith("video/") &&
     blob.type!=="application/octet-stream"){
   throw new Error("Not a video file");
  }

  const objectURL=URL.createObjectURL(blob);
  preview.src=objectURL;
  preview.hidden=false;

  const a=document.createElement("a");
  a.href=objectURL;
  a.download="MS-Video.mp4";
  document.body.appendChild(a);
  a.click();
  a.remove();

  message.textContent="Download started!";

 }catch(e){
  message.textContent=
  "Download failed. The video server may block browser access (CORS).";
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
