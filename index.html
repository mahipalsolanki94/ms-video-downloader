
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MS Video Downloader</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#10172a,#182c48);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.container{
  width:100%;
  max-width:450px;
  background:#202e45;
  padding:28px 20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 35px #0006;
}
.logo{
  font-size:35px;
  font-weight:bold;
  color:#38bdf8;
}
h1{font-size:25px}
p{color:#cbd5e1}
input{
  width:100%;
  padding:16px;
  margin:15px 0;
  border:2px solid #475569;
  border-radius:10px;
  background:#111c30;
  color:white;
  font-size:15px;
}
button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6}
#message{
  margin-top:18px;
  line-height:1.6;
  overflow-wrap:anywhere;
}
video{
  width:100%;
  margin-top:15px;
  border-radius:10px;
}
.footer{
  margin-top:25px;
  font-size:12px;
  color:#94a3b8;
}
</style>
</head>

<body>
<div class="container">

<div class="logo">MS</div>
<h1>MS Video Downloader</h1>
<p>Paste your direct MP4 video link below</p>

<input
 id="videoURL"
 type="url"
 placeholder="Paste video link here"
>

<button id="downloadBtn" onclick="downloadVideo()">
Download Video
</button>

<div id="message"></div>

<video id="preview" controls hidden></video>

<div class="footer">
© 2026 MS Video Downloader
</div>

</div>

<script>
async function downloadVideo(){

 const input=document.getElementById("videoURL");
 const message=document.getElementById("message");
 const button=document.getElementById("downloadBtn");
 const preview=document.getElementById("preview");

 const url=input.value.trim();

 if(!url){
  message.textContent="Please paste a video link.";
  return;
 }

 let parsed;

 try{
  parsed=new URL(url);
  if(!["https:","http:"].includes(parsed.protocol))
   throw new Error();
 }catch{
  message.textContent="Invalid video link!";
  return;
 }

 if(!/\.mp4($|[?#])/i.test(parsed.pathname+parsed.search)){
  message.textContent=
  "This link is not a direct MP4 file. Social media links need an authorized video source.";
  return;
 }

 button.disabled=true;
 message.textContent="Please wait...";

 try{
  const response=await fetch(url);

  if(!response.ok) throw new Error("Video unavailable");

  const blob=await response.blob();

  if(!blob.type.includes("video") &&
     !url.toLowerCase().includes(".mp4")){
    throw new Error("Not a video file");
  }

  const objectURL=URL.createObjectURL(blob);

  preview.src=objectURL;
  preview.hidden=false;

  const a=document.createElement("a");
  a.href=objectURL;
  a.download="MS-Video.mp4";
  document.body.appendChild(a);
  a.click();
  a.remove();

  message.textContent="Download started!";

  setTimeout(()=>URL.revokeObjectURL(objectURL),60000);

 }catch(error){
  message.textContent=
  "Download failed. Server may block downloading. Try a direct MP4 link from a server that allows access.";
 }finally{
  button.disabled=false;
 }
}
</script>

</body>
</html>
